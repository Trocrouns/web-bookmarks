<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f1218">
<title>我的网站收藏</title>
<style>
  :root{
    --bg:#0f1218; --card:#171c25; --card2:#1d2430; --line:#26303d;
    --fg:#e7edf5; --mute:#8b98a9; --accent:#4fb3a5; --warn:#e0a44a; --danger:#e0685f;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg);color:var(--fg);min-height:100vh;
    font:15px/1.5 -apple-system,BlinkMacSystemFont,"Noto Sans SC","PingFang SC",system-ui,sans-serif;
    padding:0 0 40px;
  }
  header{
    position:sticky;top:0;z-index:20;background:rgba(15,18,24,.92);
    backdrop-filter:blur(10px);border-bottom:1px solid var(--line);
    padding:calc(10px + env(safe-area-inset-top)) 14px 10px;
  }
  .topbar{display:flex;align-items:center;gap:8px}
  .brand{flex:1;min-width:0}
  .brand b{font-size:17px;font-weight:600;letter-spacing:.2px}
  .brand small{display:block;color:var(--mute);font-size:12px;margin-top:1px}
  .row{display:flex;gap:8px;align-items:center}
  input,select,textarea,button{font-family:inherit;font-size:15px;color:var(--fg)}
  .search{
    width:100%;background:var(--card);border:1px solid var(--line);border-radius:11px;
    padding:9px 12px;outline:none;margin-top:10px;
  }
  .search:focus{border-color:var(--accent)}
  button{
    background:var(--card);border:1px solid var(--line);border-radius:11px;
    padding:9px 13px;cursor:pointer;white-space:nowrap;
  }
  button:active{transform:scale(.97)}
  button.primary{background:var(--accent);border-color:var(--accent);color:#0b1512;font-weight:600}
  button.icon{padding:8px 11px;color:var(--mute)}
  main{padding:14px}
  .cat{margin-bottom:20px}
  .cathead{display:flex;align-items:center;gap:8px;margin:0 2px 8px}
  .cathead h2{
    margin:0;font-size:13px;font-weight:600;letter-spacing:.6px;color:var(--accent);
    text-transform:none;flex:1;min-width:0;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  }
  .cathead .count{color:var(--mute);font-size:12px;font-variant-numeric:tabular-nums}
  .cathead button{padding:4px 9px;font-size:13px;border-radius:9px;background:transparent;color:var(--mute)}
  .sit{
    display:flex;align-items:flex-start;gap:11px;background:var(--card);
    border:1px solid var(--line);border-radius:13px;padding:11px 12px;margin-bottom:8px;
  }
  .sit .av{
    flex:0 0 34px;height:34px;border-radius:9px;background:var(--card2);
    display:flex;align-items:center;justify-content:center;
    font-size:15px;font-weight:700;color:var(--accent);text-transform:uppercase;
  }
  .sit .body{flex:1;min-width:0}
  .sit a.t{color:var(--fg);text-decoration:none;font-weight:600;font-size:15px;
    display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .sit .u{color:var(--mute);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:1px}
  .sit .n{color:#b9c6d6;font-size:13px;margin-top:5px;padding-left:8px;border-left:2px solid var(--line)}
  .sit button.more{background:transparent;border:none;color:var(--mute);padding:2px 6px;font-size:18px;line-height:1}
  .blank{color:#6f7c8d;font-size:13px;padding:12px;border:1px dashed var(--line);border-radius:12px}
  .empty{
    text-align:center;color:var(--mute);padding:56px 20px;line-height:1.9;
  }
  .empty b{display:block;color:var(--fg);font-size:16px;margin-bottom:6px}
  /* sheet */
  #mask{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;z-index:40}
  #mask.on{display:block}
  .sheet{
    position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--card2);
    border-radius:18px 18px 0 0;padding:14px 14px calc(14px + env(safe-area-inset-bottom));
    display:none;max-height:88vh;overflow:auto;
  }
  .sheet.on{display:block}
  .sheet h3{margin:2px 0 12px;font-size:16px;font-weight:600}
  .sheet .item{
    padding:13px 12px;border-radius:11px;background:var(--card);margin-bottom:8px;
    display:flex;align-items:center;gap:10px;border:1px solid var(--line);cursor:pointer;
  }
  .sheet .item.danger{color:var(--danger)}
  .field{margin-bottom:11px}
  .field label{display:block;font-size:12px;color:var(--mute);margin-bottom:5px}
  .field input,.field textarea,.field select{
    width:100%;background:var(--bg);border:1px solid var(--line);border-radius:10px;
    padding:10px 11px;outline:none;
  }
  .field textarea{resize:vertical;min-height:64px}
  .field input:focus,.field textarea:focus,.field select:focus{border-color:var(--accent)}
  .hint{color:var(--mute);font-size:12px}
  .warn{background:#3a2c14;border:1px solid #6b5220;color:#f0cf95;
    padding:9px 11px;border-radius:10px;font-size:13px;margin-bottom:12px}
  .grp{display:flex;gap:8px}
  .grp>*{flex:1}
  .tips{color:var(--mute);font-size:12px;text-align:center;margin-top:26px;line-height:1.8}
</style>
</head>
<body>
<header>
  <div class="topbar">
    <div class="brand">
      <b>我的网站收藏</b>
      <small id="stat">还没有收录</small>
    </div>
    <button class="icon" id="btnTools" title="备份">⋯</button>
  </div>
  <input class="search" id="q" placeholder="搜名称、网址、备注、分类…" autocomplete="off">
</header>

<main id="list"></main>

<div id="mask"></div>
<div class="sheet" id="sheet"></div>

<script>
"use strict";
var KEY = "web-collect-v1";
var storeOK = true;
try { localStorage.setItem("__t", "1"); localStorage.removeItem("__t"); }
catch (e) { storeOK = false; }

var db = load();
var q = "";

function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,6); }

function emptyDb(){ return { v:1, cats:[] }; }

function load(){
  if (!storeOK) return emptyDb();
  try {
    var raw = localStorage.getItem(KEY);
    if (!raw) return emptyDb();
    var d = JSON.parse(raw);
    if (!d || !Array.isArray(d.cats)) return emptyDb();
    d.cats = d.cats.filter(function(c){ return c && typeof c.name === "string"; }).map(function(c){
      c.id = c.id || uid();
      c.sites = (Array.isArray(c.sites) ? c.sites : []).filter(function(s){ return s && s.url; }).map(function(s){
        return { id: s.id || uid(), title: s.title || hostOf(s.url), url: s.url, note: s.note || "" };
      });
      return c;
    });
    return d;
  } catch (e) { return emptyDb(); }
}

function save(){
  if (!storeOK) return;
  try { localStorage.setItem(KEY, JSON.stringify(db)); }
  catch (e) { storeOK = false; render(); }
}

function esc(s){
  return String(s == null ? "" : s).replace(/[&<>"']/g, function(m){
    return ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" })[m];
  });
}

function normUrl(u){
  u = String(u || "").trim();
  if (!u) return "";
  if (!/^[a-z][a-z0-9+.-]*:\/\//i.test(u) && !/^mailto:/i.test(u)) u = "https://" + u;
  return u;
}

function hostOf(u){
  try { return new URL(normUrl(u)).hostname.replace(/^www\./, ""); }
  catch (e) { return String(u || ""); }
}

function findSite(id){
  for (var i=0;i<db.cats.length;i++)
    for (var j=0;j<db.cats[i].sites.length;j++)
      if (db.cats[i].sites[j].id === id) return { cat: db.cats[i], site: db.cats[i].sites[j], ci:i, si:j };
  return null;
}

/* ---------- render ---------- */
function render(){
  var list = document.getElementById("list");
  var total = db.cats.reduce(function(n,c){ return n + c.sites.length; }, 0);
  document.getElementById("stat").textContent =
    total ? (db.cats.length + " 个分类 · " + total + " 个网站") : "还没有收录";

  var kw = q.trim().toLowerCase();
  var html = "";

  if (!storeOK) {
    html += '<div class="warn">这个浏览器不允许本地保存（多半是直接用文件方式打开的）。点右上角 ⋯ → 导出备份，换到能保存的环境再导入。</div>';
  }

  if (!db.cats.length) {
    html += '<div class="empty"><b>先建一个分类吧</b>比如「在线工具」「素材站」「AI 服务」<br>'
          + '同一个功能可以放好几个网站，备注里写清哪个好用、哪个有收藏意义</div>';
    html += '<div style="text-align:center"><button class="primary" data-act="newcat">＋ 新建分类</button></div>';
    list.innerHTML = html;
    return;
  }

  var shown = 0;
  db.cats.forEach(function(cat, ci){
    var sites = cat.sites;
    if (kw) {
      sites = sites.filter(function(s){
        return (s.title + " " + s.url + " " + s.note + " " + cat.name).toLowerCase().indexOf(kw) >= 0;
      });
      if (!sites.length) return;
    }
    shown += sites.length;
    html += '<section class="cat">';
    html += '<div class="cathead"><h2>' + esc(cat.name) + '</h2>'
          + '<span class="count">' + cat.sites.length + '</span>'
          + '<button data-act="addsite" data-ci="' + ci + '">＋</button>'
          + '<button data-act="catmenu" data-ci="' + ci + '">⋯</button></div>';
    if (!sites.length) {
      html += '<div class="blank">还没有网站，点上面的 ＋ 加一个</div>';
    }
    sites.forEach(function(s){
      var h = hostOf(s.url);
      html += '<div class="sit">'
            + '<div class="av">' + esc((h.charAt(0) || "?")) + '</div>'
            + '<div class="body">'
            +   '<a class="t" href="' + esc(normUrl(s.url)) + '" target="_blank" rel="noopener">' + esc(s.title || h) + '</a>'
            +   '<div class="u">' + esc(h) + '</div>'
            +   (s.note ? '<div class="n">' + esc(s.note) + '</div>' : '')
            + '</div>'
            + '<button class="more" data-act="sitemenu" data-id="' + esc(s.id) + '">⋯</button>'
            + '</div>';
    });
    html += '</section>';
  });

  if (kw && !shown) html += '<div class="empty">没有匹配「' + esc(q.trim()) + '」的网站</div>';

  html += '<div style="text-align:center;margin-top:6px">'
        + '<button data-act="newcat">＋ 新建分类</button></div>';
  html += '<div class="tips">数据只存在这台手机的浏览器里<br>换手机或清缓存前，先用 ⋯ 导出备份</div>';
  list.innerHTML = html;
}

/* ---------- sheet ---------- */
var mask = document.getElementById("mask");
var sheet = document.getElementById("sheet");

function openSheet(html){
  sheet.innerHTML = html;
  mask.classList.add("on");
  sheet.classList.add("on");
}
function closeSheet(){
  mask.classList.remove("on");
  sheet.classList.remove("on");
  sheet.innerHTML = "";
}
mask.addEventListener("click", closeSheet);

/* ---------- actions ---------- */
function sheetTools(){
  openSheet(
    '<h3>数据与备份</h3>'
    + '<div class="item" data-act="export">导出备份（复制到剪贴板）</div>'
    + '<div class="item" data-act="import">从备份导入</div>'
    + '<div class="item" data-act="newcat">新建分类</div>'
    + '<div class="item" data-act="close">关闭</div>'
  );
}

function sheetSiteMenu(id){
  var f = findSite(id);
  if (!f) return;
  openSheet(
    '<h3>' + esc(f.site.title || hostOf(f.site.url)) + '</h3>'
    + '<div class="item" data-act="editsite" data-id="' + esc(id) + '">编辑</div>'
    + '<div class="item" data-act="copysite" data-id="' + esc(id) + '">复制网址</div>'
    + '<div class="item" data-act="movesite" data-id="' + esc(id) + '" data-dir="-1">上移</div>'
    + '<div class="item" data-act="movesite" data-id="' + esc(id) + '" data-dir="1">下移</div>'
    + '<div class="item danger" data-act="delsite" data-id="' + esc(id) + '">删除这个网站</div>'
    + '<div class="item" data-act="close">取消</div>'
  );
}

function sheetCatMenu(ci){
  var cat = db.cats[ci];
  if (!cat) return;
  openSheet(
    '<h3>' + esc(cat.name) + '</h3>'
    + '<div class="item" data-act="addsite" data-ci="' + ci + '">在这个分类里加网站</div>'
    + '<div class="item" data-act="renamecat" data-ci="' + ci + '">重命名</div>'
    + '<div class="item" data-act="movecat" data-ci="' + ci + '" data-dir="-1">上移</div>'
    + '<div class="item" data-act="movecat" data-ci="' + ci + '" data-dir="1">下移</div>'
    + '<div class="item danger" data-act="delcat" data-ci="' + ci + '">删除整个分类</div>'
    + '<div class="item" data-act="close">取消</div>'
  );
}

function sheetSiteForm(opts){
  // opts: { id?, ci }
  var cat, site = { title:"", url:"", note:"" };
  var editing = false;
  if (opts.id) {
    var f = findSite(opts.id);
    if (!f) return;
    editing = true; site = f.site;
  }
  var sel = (opts.ci != null) ? opts.ci : 0;
  cat = db.cats[sel];
  var options = db.cats.map(function(c, i){
    return '<option value="' + i + '"' + (i === sel ? " selected" : "") + '>' + esc(c.name) + '</option>';
  }).join("");

  openSheet(
    '<h3>' + (editing ? "编辑网站" : "加一个网站") + '</h3>'
    + '<div class="field"><label>名称</label><input id="f-title" placeholder="比如：TinEye 反向搜图" value="' + esc(site.title) + '"></div>'
    + '<div class="field"><label>网址</label><input id="f-url" inputmode="url" placeholder="tineye.com" value="' + esc(site.url) + '"></div>'
    + '<div class="field"><label>分类</label><select id="f-cat">' + options + '</select></div>'
    + '<div class="field"><label>备注 / 收藏理由（可空）</label><textarea id="f-note" placeholder="和同类的有什么区别、为什么留着它">' + esc(site.note) + '</textarea></div>'
    + '<div class="grp"><button data-act="close">取消</button>'
    + '<button class="primary" data-act="savesite" data-id="' + esc(opts.id || "") + '">保存</button></div>'
  );
  setTimeout(function(){ var el = document.getElementById(editing ? "f-title" : "f-url"); if (el) el.focus(); }, 60);
}

function sheetCatForm(mode, ci){
  var name = mode === "rename" ? db.cats[ci].name : "";
  openSheet(
    '<h3>' + (mode === "rename" ? "重命名分类" : "新建分类") + '</h3>'
    + '<div class="field"><label>分类名</label><input id="c-name" placeholder="比如：在线工具 / 素材站 / AI 服务" value="' + esc(name) + '"></div>'
    + '<div class="grp"><button data-act="close">取消</button>'
    + '<button class="primary" data-act="savecat" data-mode="' + mode + '" data-ci="' + (ci == null ? -1 : ci) + '">保存</button></div>'
  );
  setTimeout(function(){ var el = document.getElementById("c-name"); if (el) el.focus(); }, 60);
}

function sheetImport(){
  openSheet(
    '<h3>从备份导入</h3>'
    + '<div class="field"><label>把导出的内容粘进来</label><textarea id="f-json" placeholder=\'{"v":1,"cats":[...]}\' style="min-height:120px"></textarea></div>'
    + '<div class="grp"><button data-act="close">取消</button>'
    + '<button class="primary" data-act="doimport">导入</button></div>'
  );
}

document.addEventListener("click", function(ev){
  var el = ev.target.closest("[data-act]");
  if (!el) return;
  var act = el.getAttribute("data-act");
  var ci = parseInt(el.getAttribute("data-ci"), 10);
  var id = el.getAttribute("data-id");
  var dir = parseInt(el.getAttribute("data-dir"), 10);

  if (act === "close") return closeSheet();
  if (act === "newcat") return sheetCatForm("new");
  if (act === "catmenu") return sheetCatMenu(ci);
  if (act === "sitemenu") return sheetSiteMenu(id);
  if (act === "addsite") return sheetSiteForm({ ci: isNaN(ci) ? 0 : ci });
  if (act === "editsite") return sheetSiteForm({ id: id });
  if (act === "renamecat") return sheetCatForm("rename", ci);
  if (act === "export") return doExport();
  if (act === "import") return sheetImport();

  if (act === "savesite") {
    var title = document.getElementById("f-title").value.trim();
    var url = normUrl(document.getElementById("f-url").value);
    var note = document.getElementById("f-note").value.trim();
    var target = parseInt(document.getElementById("f-cat").value, 10);
    if (!url) { alert("网址不能为空"); return; }
    if (!db.cats.length) { alert("先建一个分类"); return; }
    if (id) {
      var f = findSite(id);
      if (!f) return closeSheet();
      var s = { id: f.site.id, title: title || hostOf(url), url: url, note: note };
      if (target !== f.ci) { f.cat.sites.splice(f.si, 1); db.cats[target].sites.push(s); }
      else { f.cat.sites[f.si] = s; }
    } else {
      db.cats[target].sites.push({ id: uid(), title: title || hostOf(url), url: url, note: note });
    }
    save(); closeSheet(); render(); return;
  }

  if (act === "savecat") {
    var nm = document.getElementById("c-name").value.trim();
    if (!nm) { alert("分类名不能为空"); return; }
    var mode = el.getAttribute("data-mode");
    if (mode === "rename") db.cats[ci].name = nm;
    else db.cats.push({ id: uid(), name: nm, sites: [] });
    save(); closeSheet(); render(); return;
  }

  if (act === "delsite") {
    var g = findSite(id);
    if (!g) return closeSheet();
    if (confirm("删除「" + (g.site.title || hostOf(g.site.url)) + "」？")) {
      g.cat.sites.splice(g.si, 1);
      save(); render();
    }
    return closeSheet();
  }

  if (act === "delcat") {
    var c = db.cats[ci];
    if (!c) return closeSheet();
    if (confirm("删除分类「" + c.name + "」和里面 " + c.sites.length + " 个网站？")) {
      db.cats.splice(ci, 1);
      save(); render();
    }
    return closeSheet();
  }

  if (act === "movecat") {
    var to = ci + dir;
    if (to >= 0 && to < db.cats.length) {
      var tmp = db.cats[ci]; db.cats[ci] = db.cats[to]; db.cats[to] = tmp;
      save(); render();
    }
    return closeSheet();
  }

  if (act === "movesite") {
    var g2 = findSite(id);
    if (!g2) return closeSheet();
    var to2 = g2.si + dir;
    if (to2 >= 0 && to2 < g2.cat.sites.length) {
      var arr = g2.cat.sites;
      var t2 = arr[g2.si]; arr[g2.si] = arr[to2]; arr[to2] = t2;
      save(); render();
    }
    return closeSheet();
  }

  if (act === "copysite") {
    var g3 = findSite(id);
    if (!g3) return closeSheet();
    var full = normUrl(g3.site.url);
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(full).then(function(){ closeSheet(); }, function(){ prompt("复制网址", full); closeSheet(); });
    } else { prompt("复制网址", full); closeSheet(); }
    return;
  }

  if (act === "doimport") {
    try {
      var d = JSON.parse(document.getElementById("f-json").value);
      if (!d || !Array.isArray(d.cats)) throw new Error("格式不对");
      if (db.cats.length && !confirm("导入会合并到现有收藏，继续？")) return;
      d.cats.forEach(function(c){
        if (!c || !c.name) return;
        var exist = db.cats.filter(function(x){ return x.name === c.name; })[0];
        var target2 = exist || (db.cats[db.cats.push({ id: uid(), name: c.name, sites: [] }) - 1]);
        (c.sites || []).forEach(function(s){
          if (!s || !s.url) return;
          target2.sites.push({ id: uid(), title: s.title || hostOf(s.url), url: normUrl(s.url), note: s.note || "" });
        });
      });
      save(); closeSheet(); render();
      alert("已导入");
    } catch (e) { alert("导入失败：内容不是有效的备份 JSON"); }
    return;
  }
});

function doExport(){
  var json = JSON.stringify(db, null, 2);
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(json).then(function(){
      closeSheet();
      alert("备份已复制到剪贴板，粘到备忘录或笔记里存好。");
    }, function(){ fallbackExport(json); });
  } else fallbackExport(json);
}

function fallbackExport(json){
  openSheet('<h3>备份内容（长按全选复制）</h3>'
    + '<div class="field"><textarea style="min-height:220px">' + esc(json) + '</textarea></div>'
    + '<div class="grp"><button class="primary" data-act="close">好</button></div>');
}

document.getElementById("q").addEventListener("input", function(e){
  q = e.target.value; render();
});
document.getElementById("btnTools").addEventListener("click", sheetTools);

render();
</script>
</body>
</html>
